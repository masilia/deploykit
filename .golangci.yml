version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - errorlint
    - bodyclose
    - noctx
    - gosec
  exclusions:
    rules:
      # Tests build temporary files and run the reference shell scripts with computed paths.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/masilia/deploykit

run:
  timeout: 5m
