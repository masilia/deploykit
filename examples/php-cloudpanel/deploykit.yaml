# Example profile: PHP application (Symfony-style) on a CloudPanel PHP site, release folders, PHP-FPM.
# HYPOTHESIS: there is no reference script for PHP yet. This draft mirrors the Next.js profile and is meant to be
# corrected against a real project and a sandbox CloudPanel server (roadmap phases 2 and 6). Items marked SPIKE
# depend on facts that must be verified there (docs/cloudpanel-cli.md, "Gaps").

version: 1
project: my-php-app

inventory: targets/

artifact:
  type: release-dir
  source: { ref: HEAD }                          # clean `git archive` export (ADR 0005)
  build:
    checks: []
    install: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
    command: ""                                  # e.g. a frontend build; optional
    env: {}
  assemble:
    - { from: ".", to: ".", exclude: [".git", "tests", "var/cache", "var/log", "node_modules", ".env.local"] }
  keep: 3

runtime:
  type: php-fpm                                  # pools are managed by CloudPanel, not by deploykit
  php_version: "8.3"
  switch: atomic_symlink                         # `current` -> releases/<stamp>
  shared:                                        # persisted outside the releases, symlinked into each one
    - { path: .env.local, kind: file }
    - { path: var/log,    kind: dir }
    - { path: public/uploads, kind: dir }
  app:
    commands:                                    # run as the site user inside the new release, before the switch
      migrate:    php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      warmup:     php bin/console cache:warmup --env=prod
    hooks:
      before_switch: [migrate, warmup]
  permissions:
    reset: { command: "clpctl system:permissions:reset", directories: 770, files: 660 }   # site-user command
  opcache:
    after_switch: spike                          # SPIKE: a site user cannot reload PHP-FPM; see docs/cloudpanel-cli.md
  health:
    where: server
    path: /health
    expect: 200
    tries: 30
    interval: 1s
  on_failure:
    rollback: previous_release

ingress:
  type: cloudpanel
  site:
    type: php                                    # clpctl site:add:php
    php_version: "8.3"
    vhost_template: "{{ vhost_template }}"       # `Generic` or a custom one shipped with `vhost-template:add`
    user: "{{ target.site_user }}"
    user_password: { generate: 24, show_once: true }
    web_root: current/public                     # SPIKE: clpctl has no web-root option; custom template or fixed layout
  vhost_templates:                               # imported with `clpctl vhost-template:add --name --file`
    - { name: my-symfony, file: vhost/symfony.tpl }
  database:                                      # optional: `clpctl db:add` creates it; dump/import belong to another project
    create: { name: "{{ target.db_name }}", user: "{{ target.db_user }}", password: { generate: 24, store: "shared/.env.local" } }
  tls:
    command: lets-encrypt
    require_dns: ["{{ target.domain }}", "www.{{ target.domain }}"]
    san_www: if_dns_resolves
    on_failure: warn

ssh:
  commands_on_stdin: true
  provision_user: root
  install_key_for_site_user: { public_key: auto }

env: {}
hooks:
  before_upload: []
  before_switch: []
  after_switch: []
